# /etc/systemd/journald.conf.d/90-star.conf, installed by scripts/harden.sh.
#
# Keep logs across reboots and power cuts (Raspberry Pi OS keeps them in RAM
# only, via 40-rpi-volatile-storage.conf, which this overrides), with hard
# limits so they can never fill the SD card.
[Journal]
Storage=persistent
Compress=yes
# On the SD card: at most 100 MB, at most one month old, and always leave 2 GB free.
SystemMaxUse=100M
SystemKeepFree=2G
SystemMaxFileSize=10M
MaxRetentionSec=1month
# In RAM before the SD card is ready (early boot): at most 50 MB.
RuntimeMaxUse=50M
RuntimeMaxFileSize=10M
# Write to the card in batches (default 5 minutes) rather than per message;
# errors and above are still written immediately.
SyncIntervalSec=5m
# Nothing else reads syslog on this host.
ForwardToSyslog=no
# One noisy program can't flood the log: 1000 lines per 30 s per service.
RateLimitIntervalSec=30s
RateLimitBurst=1000
