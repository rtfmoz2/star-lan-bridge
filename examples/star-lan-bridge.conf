# /etc/star-lan-bridge.conf: one [printer:NAME] section per Bluetooth printer.
#
# Star clients find printers by IP address and use fixed ports (22222, 9100,
# 9101), so every printer needs its own address on the network. Addresses come
# from DHCP, so the same config works on any network:
#
#   device   RFCOMM TTY bound to the printer (rfcomm-printer*.service)
#   address  auto  the Pi's own DHCP address (use it for one printer at most)
#            dhcp  the printer gets its own DHCP lease; star-admin requests it
#                  with a per-printer client ID, so the router keeps handing
#                  back the same address. Don't reserve the Pi's MAC on routers
#                  that reserve by MAC (e.g. UniFi): docs/ADMIN.md
#            a.b.c.d  a fixed address, if you really need one
#   local    optional loopback address for a CUPS queue on this host:
#            socket://<local>:9100
#   mac      optional MAC reported in discovery replies (default: the MAC of
#            the interface holding the address). Give each printer a distinct
#            one; the printer's own Bluetooth MAC works well.
#
# The bridge restarts by itself when an address changes (new lease, new Wi-Fi).
# Names: letters, digits, '.', '_' or '-'.

[printer:TSP143]
device  = /dev/rfcomm0
address = auto
local   = 127.0.0.1

[printer:TSP143-2]
device  = /dev/rfcomm1
address = dhcp
local   = 127.0.0.2
mac     = 00:11:62:2E:75:05
