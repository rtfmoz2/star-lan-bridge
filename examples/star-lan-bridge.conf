# /etc/star-lan-bridge.conf: one [printer:NAME] section per Bluetooth printer.
#
# Star clients find printers by IP address and use fixed ports (22222, 9100,
# 9101), so every printer needs its own LAN address. Add the extra addresses
# to the host's interface (docs/SETUP.md, "Several printers"); on Wi-Fi this
# means secondary IPs on wlan0, which share the Pi's MAC address.
#
#   device   RFCOMM TTY bound to the printer (rfcomm-printer*.service)
#   address  LAN IPv4 the printer is advertised at and answers on
#   local    optional loopback address for a CUPS queue on this host:
#            socket://<local>:9100
#   mac      optional MAC reported in discovery replies (default: the MAC of
#            the interface holding `address`). Give each printer a distinct
#            one; the printer's own Bluetooth MAC works well.
#
# Delete this file to go back to single-printer mode (all addresses, /dev/rfcomm0).

[printer:TSP143]
device  = /dev/rfcomm0
address = 192.168.1.134
local   = 127.0.0.1

[printer:TSP143-2]
device  = /dev/rfcomm1
address = 192.168.1.250
local   = 127.0.0.2
mac     = 00:11:62:2E:75:05
